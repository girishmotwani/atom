[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atom-cli"
version = "0.1.0"
description = "Atom - an agentic development framework for Go. POC first, then spec, then TDD."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Girish Motwani" }]
keywords = ["go", "golang", "tdd", "agent", "ai", "development-framework"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
atom = "atom.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["atom*"]

[tool.setuptools.package-data]
atom = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
