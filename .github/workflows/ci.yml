name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tools:
    name: atom CLI (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The isolation POC only proved Go's nested-module behaviour on Windows.
        # Running the suite on all three platforms is how we close that gap.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        working-directory: tools
        run: python -m pip install -e ".[dev]"

      - name: Test
        working-directory: tools
        run: python -m pytest tests -v --cov=atom --cov-report=term-missing

  poc:
    name: POC spikes still run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The spikes were written and observed on Windows. Running them on all
        # three platforms is what turns "we saw this on one machine" into
        # evidence -- and is the stated way the reports close their own
        # single-platform gap.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A spike is evidence only for as long as it still runs. If module isolation
      # ever stops holding, this job fails and the design decision that rests on it
      # gets revisited rather than quietly inherited.
      - name: Re-run the module-isolation spike
        run: python poc/module-isolation/spike.py

      # Phase 2 rests on `go run` flattening non-zero exit codes to 1, which is
      # why `atom poc run` builds then executes. This spike asserts that
      # refutation still holds -- if Go ever fixes it, the job fails and tells us
      # poc-report.md has gone stale, rather than passing quietly.
      - name: Re-run the go-run failure-modes spike
        run: python poc/go-run-failure-modes/spike.py

  docs:
    name: Doc links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Atom's skills navigate by relative link. A broken link silently drops a
      # discipline reference an agent was told to read.
      - name: Check relative markdown links
        run: python tools/check_links.py
